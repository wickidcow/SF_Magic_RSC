name: Translate Magic to English

on:
  push:
    branches:
      - release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation runtime
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch transformers sentencepiece sacremoses PyYAML

      - name: Translate YAML player-facing strings
        run: python scripts/translate_player_text.py --batch-size 96

      - name: Translate JavaScript player-facing strings
        run: python tools/translate_js_messages.py --batch-size 96

      - name: Validate editable YAML syntax
        run: |
          python - <<'PY'
          import pathlib, yaml
          skip = {'.github', 'saveditems', 'scripts', 'audit', 'tools'}
          errors = []
          for path in pathlib.Path('.').rglob('*.yml'):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('All editable YAML files parsed successfully')
          PY

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find scripts -type f -name '*.js' -print0)
          echo "All JavaScript files passed syntax checking"

      - name: Re-audit translated pack
        run: |
          python scripts/audit_magic.py
          python tools/audit_js_messages.py

      - name: Upload English reports
        uses: actions/upload-artifact@v4
        with:
          name: magic-english-translation-report
          path: |
            audit/translation-report.tsv
            audit/js-translation-report.tsv
            audit/JS_MESSAGES.md
            audit/js-chinese-strings.json
          if-no-files-found: error

      - name: Commit English pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.yml' 'scripts/*.js' 'scripts/**/*.js'
          if git diff --cached --quiet; then
            echo "No translation changes to commit"
            exit 0
          fi
          git commit -m "Translate Magic player-facing text to English"
          git push origin HEAD:release-candidate

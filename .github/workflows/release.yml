name: Publish Magic Legacy JAR

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.8
        required: true
        default: v2.0.8

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build verified release JAR
        run: |
          set -euo pipefail
          gradle clean shadowJar verifyMagicJar \
            -PplatformVersion=1.21.11-R0.1-SNAPSHOT \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon
          test -s build/libs/SF_MagicLegacy2.0.8.jar

      - name: Publish raw JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          test -n "$TAG"
          JAR=build/libs/SF_MagicLegacy2.0.8.jar
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Magic Legacy 2.0.8" \
              --notes "Managed Java-plugin release. Put SF_MagicLegacy2.0.8.jar in plugins/. Existing unmanaged RSC Magic content is backed up automatically on first startup."
          fi
          gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          sha256sum "$JAR" > SF_MagicLegacy2.0.8.jar.sha256
          gh release upload "$TAG" SF_MagicLegacy2.0.8.jar.sha256 --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: SF_MagicLegacy2.0.8
          path: build/libs/SF_MagicLegacy2.0.8.jar
          if-no-files-found: error

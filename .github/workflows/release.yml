name: Release Magic Legacy

on:
  push:
    branches:
      - main
    paths:
      - '*.yml'
      - 'saveditems/**'
      - 'scripts/**/*.js'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate Legacy version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('info.yml').read_text(encoding='utf-8')
          m = re.search(r'^version:\s*["\x27]?([^"\x27\r\n]+)', text, re.M)
          if not m:
              raise SystemExit('Could not read version from info.yml')
          print(m.group(1).strip())
          PY
          )"
          if [[ "$version" != Legacy-* ]]; then
            echo "Not a Legacy release version: $version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build runtime addon archive
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          root="dist/Magic"
          mkdir -p "$root/scripts" "$root/saveditems"
          cp ./*.yml "$root/"
          if [ -d saveditems ]; then
            cp -R saveditems/. "$root/saveditems/"
          fi
          if [ -d scripts ]; then
            find scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
              target="$root/$file"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            done
          fi

          python tools/apply_runtime_fixes.py "$root"

          archive="Magic-${version}.zip"
          (cd dist && zip -9 -r "../$archive" Magic >/dev/null)
          sha256sum "$archive" > "$archive.sha256"
          echo "MAGIC_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify runtime package
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if unzip -Z1 "$MAGIC_ARCHIVE" | grep -Eq '(^|/)\.github/|\.py$|(^|/)audit/|(^|/)tools/|(^|/)README\.md$'; then
            echo "Release archive contains maintenance files"
            exit 1
          fi
          test "$(unzip -Z1 "$MAGIC_ARCHIVE" | grep -c '^Magic/info.yml$')" -eq 1
          test "$(unzip -Z1 "$MAGIC_ARCHIVE" | grep -c '^Magic/items.yml$')" -eq 1

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$MAGIC_ARCHIVE" -d "$verify_dir"
          runtime="$verify_dir/Magic"

          if grep -R -n --include='*.yml' --include='*.yaml' --include='*.js' \
              'io.github.mooy1.infinityexpansion.items.blocks.InfinityWorkbench' "$runtime"; then
            echo "Old InfinityExpansion v1 workbench class remained anywhere in the release package"
            exit 1
          fi

          if grep -q '^MAGIC_POWERED_BEDROCK_COMPAT:' "$runtime/items.yml"; then
            echo "Obsolete POWERED_BEDROCK compatibility shim remained in release package"
            exit 1
          fi

          # These IDs have verified current owners and should always be normalized in
          # the shipped Legacy runtime so RSC does not warn about dead first choices.
          if grep -R -n --include='*.yml' --include='*.yaml' \
              -E '^[[:space:]]*material:[[:space:]]*(VEX_GEM|DT_BEE|GROWTH_CHAMBER_MK2)([[:space:]]|$)' "$runtime"; then
            echo "Legacy DynaTech item IDs remained in release package"
            exit 1
          fi

          if grep -R -n --include='*.yml' --include='*.yaml' \
              'material: GCE_EXCITATION_CHAMBER_10 | GCE_EXCITATION_CHAMBER_3' "$runtime"; then
            echo "Obsolete GCE tier-10 fallback remained in release package"
            exit 1
          fi

          duplicates="$(awk '/^[A-Za-z0-9_.-]+:[[:space:]]*($|#)/ {k=$1; sub(/:$/, "", k); count[k]++} END {for (k in count) if (count[k] > 1) print k}' "$runtime/template_machines.yml")"
          if [ -n "$duplicates" ]; then
            echo "Duplicate top-level template machine keys remained:"
            echo "$duplicates"
            exit 1
          fi

      - name: Create or update GitHub release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## Magic RSC Legacy — $VERSION

          Compatibility port of Magic by magicsolo/Yomicer for the modern Slimefun Legacy stack.

          ### Highlights
          - Slimefun Legacy compatibility target
          - InfinityExpansion2-native item IDs and recipe references
          - Current DynaTech IDs for Bee, Vex Gem, and Growth Chamber MK2 integrations
          - Current GeneticChickengineering tier-3 excitation chamber integration
          - Runtime compatibility cleanup for legacy IE1 references
          - Duplicate top-level YAML entries removed from the packaged drop-in
          - Obsolete Magic POWERED_BEDROCK shim removed in favor of IE2's native item
          - Current InfinityExpansion2 InfinityWorkbench class path used throughout the runtime package
          - Runtime-only drop-in archive for RykenSlimefunCustomizer
          - Original MAGIC_* bridge IDs preserved
          - Maintained for the Paper 26.2 Slimefun Legacy stack

          ### Install
          Stop the server and replace the existing Magic addon directory rather than merging files into it.

          Final location:

          plugins/RykenSlimefunCustomizer/addons/Magic

          The final file path should include:

          plugins/RykenSlimefunCustomizer/addons/Magic/info.yml

          A clean directory replacement is important because obsolete YAML/scripts from older Magic builds can otherwise remain on disk and continue loading.

          Requires RykenSlimefunCustomizer plus the dependencies listed in info.yml.

          Original Magic project: magicsolo / Yomicer
          Legacy compatibility maintenance: wickidcow
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets"
            gh release edit "$TAG" \
              --title "Magic RSC $VERSION" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$TAG" "$MAGIC_ARCHIVE" "$MAGIC_ARCHIVE.sha256" --clobber
            exit 0
          fi

          gh release create "$TAG" "$MAGIC_ARCHIVE" "$MAGIC_ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Magic RSC $VERSION" \
            --notes-file release-notes.md \
            --prerelease

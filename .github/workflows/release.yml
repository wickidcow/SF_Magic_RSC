name: Publish Magic Legacy JAR

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; leave blank to use the version from build.gradle.kts
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build verified release JAR
        run: |
          set -euo pipefail
          gradle clean shadowJar verifyMagicJar \
            -PplatformVersion=1.21.11-R0.1-SNAPSHOT \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon
          test -s "build/libs/SF_MagicLegacy${{ steps.version.outputs.version }}.jar"

      - name: Publish raw JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION"
          fi
          JAR="build/libs/SF_MagicLegacy${VERSION}.jar"
          test -s "$JAR"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Magic Legacy ${VERSION}" \
              --notes "Managed Java-plugin release. Put SF_MagicLegacy${VERSION}.jar in plugins/. Existing unmanaged RSC Magic content is backed up automatically on first startup. The managed RSC runtime hard-requires only Slimefun; integration addons are optional and missing crossover content skips individually instead of preventing all of Magic from loading. This release also includes validated skull textures, repaired serialized starter reward chests, MagicLegacy/RSC managed-runtime ownership support, stable base-Networks recipe fallbacks in place of deprecated NTW_EXPANSION blueprint dependencies, and clearer Doctor diagnostics for MagicExpansion and Networks Expansion."
          fi
          gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          SHA_FILE="SF_MagicLegacy${VERSION}.jar.sha256"
          sha256sum "$JAR" > "$SHA_FILE"
          gh release upload "$TAG" "$SHA_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: SF_MagicLegacy${{ steps.version.outputs.version }}
          path: build/libs/SF_MagicLegacy${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

name: Clean Magic Text Quality

on:
  push:
    branches:
      - main
    paths:
      - 'tools/clean_magic_text_quality.py'
      - '.github/workflows/clean-text-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Magic player-facing text quality
        run: python tools/clean_magic_text_quality.py .

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.yml' 'saveditems/*.yml'
          if git diff --cached --quiet; then
            echo "Magic text quality is already clean"
            exit 0
          fi
          git commit -m "Clean Magic English lore quality"
          git push

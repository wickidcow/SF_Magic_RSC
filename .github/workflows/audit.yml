name: Magic Legacy Audit

on:
  push:
    branches:
      - main
      - legacy-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit Magic pack
        run: |
          python scripts/validate_saveditems_yaml.py
          python scripts/validate_script_refs.py
          python scripts/audit_magic.py
          python scripts/audit_magic_quality.py
          python tools/verify_polyglot_runtime_fix.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: magic-legacy-audit
          path: audit/
          if-no-files-found: error

name: Refresh Magic 1.1.20 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-1.1.20-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Update 1.1.20 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Magic RSC Legacy — Legacy-1.1.20

          Compatibility port of Magic by magicsolo/Yomicer for the modern Slimefun Legacy stack.

          ### 1.1.20 fixes
          - Fixed invalid Bukkit YAML serialization in `saveditems/mx2.yml` through `mx5.yml` caused by the apostrophe in `Owner's Love`.
          - Restored the previously missing `基础枪.js` runtime script referenced by `MAGIC_GUN_1`, using a conservative Legacy hitscan implementation.
          - Added a saved-item YAML validator so malformed single-quoted Bukkit item metadata fails CI/package validation instead of reaching a server.
          - Added a script-reference validator; all 251 configured Magic script references now resolve to packaged JavaScript files.
          - Confirmed the four `machine ... recipe!` messages are diagnostic warnings for script-driven machines rather than failed registrations.
          - Preserved optional compatibility registration gates; the raw `953/953` counter is not required when optional integrations are intentionally unavailable.

          ### Existing Legacy compatibility work
          - Slimefun Legacy compatibility target
          - Player-facing Magic names and lore translated to English, including serialized saved items
          - InfinityExpansion2-native item IDs and recipe references
          - Current DynaTech and GeneticChickengineering integrations
          - Optional FN Amplifications and legacy-provider machines gated by their actual Slimefun items
          - Runtime cleanup for legacy InfinityExpansion references
          - Duplicate top-level YAML entries removed from the packaged drop-in
          - Current InfinityExpansion2 InfinityWorkbench class path used throughout the runtime package
          - Original `MAGIC_*` bridge IDs preserved
          - Maintained for the Paper 26.2 Slimefun Legacy stack

          ### Install
          Requires RykenSlimefunCustomizer (RSC).

          Stop the server and replace the existing folder at:

          `plugins/RykenSlimefunCustomizer/addons/Magic/`

          Do not merge the new folder into an older Magic folder; replace the old folder so stale files cannot survive the upgrade.

          Original Magic project: magicsolo / Yomicer  
          Legacy compatibility maintenance: wickidcow
          EOF

          gh release edit legacy-1.1.20 \
            --repo wickidcow/SF_Magic_RSC \
            --title 'Magic RSC Legacy-1.1.20' \
            --notes-file release-notes.md \
            --prerelease

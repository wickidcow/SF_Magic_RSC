name: Restore Magic CRLF

on:
  push:
    branches:
      - cleanup/no-guizhan-english
    paths:
      - tools/restore_crlf.py
      - .github/workflows/restore-crlf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/no-guizhan-english
          fetch-depth: 0
      - name: Restore original line ending convention
        run: python3 tools/restore_crlf.py
      - name: Commit line ending cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.yml' scripts
          if git diff --cached --quiet; then
            echo 'No line ending cleanup needed.'
            exit 0
          fi
          git commit -m 'Restore original Magic data line endings'
          git push origin HEAD:cleanup/no-guizhan-english

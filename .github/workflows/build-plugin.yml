name: Build Magic Legacy Plugin

on:
  push:
    branches:
      - main
      - standalone-plugin-2.0
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'saveditems/**'
      - '*.yml'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'saveditems/**'
      - '*.yml'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Java 21 drop-in JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify managed Magic runtime JAR
        run: |
          set -euo pipefail
          gradle clean shadowJar verifyMagicJar \
            -PplatformVersion=1.21.11-R0.1-SNAPSHOT \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon

      - name: Inspect distributable
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SF_MagicLegacy${{ steps.version.outputs.version }}.jar
          test -s "$JAR"

          for ENTRY in \
            'plugin.yml' \
            'embedded/Magic/info.yml' \
            'embedded/Magic/items.yml' \
            'embedded/Magic/foods.yml' \
            'embedded/Magic/scripts/服务器.js' \
            'io/github/wickidcow/magiclegacy/MagicGunListener.class' \
            'io/github/wickidcow/magiclegacy/ChristmasSnowballListener.class' \
            'io/github/wickidcow/magiclegacy/ExperienceItemListener.class' \
            'io/github/wickidcow/magiclegacy/UnbreakableRuneListener.class' \
            'io/github/wickidcow/magiclegacy/MagicWeaponListener.class' \
            'io/github/wickidcow/magiclegacy/RandomFoodListener.class' \
            'io/github/wickidcow/magiclegacy/MagicSoundListener.class' \
            'io/github/wickidcow/magiclegacy/MagicLaserStickListener.class' \
            'io/github/wickidcow/magiclegacy/FlameFormationListener.class' \
            'io/github/wickidcow/magiclegacy/SnowFoodListener.class' \
            'io/github/wickidcow/magiclegacy/PlanecupListener.class' \
            'io/github/wickidcow/magiclegacy/BannerLianhunListener.class' \
            'io/github/wickidcow/magiclegacy/PowerBankListener.class' \
            'io/github/wickidcow/magiclegacy/MobCatcherListener.class' \
            'io/github/wickidcow/magiclegacy/MagicMobSpawnListener.class' \
            'io/github/wickidcow/magiclegacy/SlimefunBlockStorageBridge.class' \
            'io/github/wickidcow/magiclegacy/NativeSpawnerManager.class'; do
            jar tf "$JAR" | grep -Fxq "$ENTRY"
          done

          for SCRIPT in \
            'embedded/Magic/scripts/基础枪.js' \
            'embedded/Magic/scripts/CHRISTMAS_SNOWBALL.js' \
            'embedded/Magic/scripts/MFEXPBOTTLE.js' \
            'embedded/Magic/scripts/MFEXPBOTTLE100.js' \
            'embedded/Magic/scripts/UNBREAKABLE_RUNE.js' \
            'embedded/Magic/scripts/INFINITE_STICK.js' \
            'embedded/Magic/scripts/QYZJ_1.js' \
            'embedded/Magic/scripts/randomfood.js' \
            'embedded/Magic/scripts/planecup.js' \
            'embedded/Magic/scripts/BANNER_LIST.js' \
            'embedded/Magic/scripts/CDB_1.js' \
            'embedded/Magic/scripts/CDB_2.js' \
            'embedded/Magic/scripts/SOME_CATCH.js' \
            'embedded/Magic/scripts/ALL_CATCH.js' \
            'embedded/Magic/scripts/ANIMALS_SPAWN.js' \
            'embedded/Magic/scripts/ARTIFICIAL_SPAWN.js' \
            'embedded/Magic/scripts/SPAWNER.js' \
            'embedded/Magic/scripts/sound.js' \
            'embedded/Magic/scripts/magic_stick_jiguang_1.js' \
            'embedded/Magic/scripts/阵法_小火苗_1.js' \
            'embedded/Magic/scripts/snow_food.js'; do
            if jar tf "$JAR" | grep -Fxq "$SCRIPT"; then
              echo "Removed runtime script still packaged: $SCRIPT" >&2
              exit 1
            fi
          done

          assert_no_hook() {
            local file="$1"
            local item="$2"
            local script="$3"
            if unzip -p "$JAR" "embedded/Magic/${file}" \
              | sed -n "/^${item}:/,/^[A-Z0-9_][A-Z0-9_]*:/p" \
              | grep -Fq "script: ${script}"; then
              echo "${item} still has legacy script hook ${script}" >&2
              exit 1
            fi
          }

          assert_no_hook items.yml MAGIC_GUN_1 基础枪
          assert_no_hook items.yml MAGIC_CHRISTMAS_SNOWBALL CHRISTMAS_SNOWBALL
          assert_no_hook items.yml MAGIC_EXP_COLLECTOR MFEXPBOTTLE
          assert_no_hook items.yml MAGIC_EXP_BOTTLE MFEXPBOTTLE100
          assert_no_hook items.yml MAGIC_UNBREAKABLE_RUNE UNBREAKABLE_RUNE
          assert_no_hook items.yml MAGIC_INFINITE_STICK INFINITE_STICK
          assert_no_hook items.yml MAGIC_INFINITY_BLADE_1 QYZJ_1
          assert_no_hook foods.yml MAGIC_FOODS_RANDOMFOOD randomfood
          assert_no_hook foods.yml MAGIC_FOODS_JIAOZI snow_food
          assert_no_hook foods.yml MAGIC_FOODS_APPLE snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_1 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_2 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_3 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_4 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_5 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_6 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_7 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_8 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_9 snow_food
          assert_no_hook foods.yml MAGIC_FOODS_A_10 snow_food
          assert_no_hook items.yml MAGIC_SOUND sound
          assert_no_hook items.yml MAGIC_STICK_JIGUANG_1 magic_stick_jiguang_1
          assert_no_hook items.yml MAGIC_ZHENFA_FIRE_1 阵法_小火苗_1
          assert_no_hook items.yml MAGIC_NEW_PLANECUP planecup
          assert_no_hook items.yml MAGIC_BANNER_LIANHUN BANNER_LIST
          assert_no_hook items.yml MAGIC_POWER_BANK_DESCRIPTION CDB_1
          assert_no_hook items.yml MAGIC_POWER_BANK_ALPHA CDB_1
          assert_no_hook items.yml MAGIC_POWER_BANK_BETA CDB_2
          for SCRIPT in SOME_CATCH ALL_CATCH ANIMALS_SPAWN ARTIFICIAL_SPAWN SPAWNER; do
            if unzip -p "$JAR" embedded/Magic/items.yml | grep -Eq "^[[:space:]]+script:[[:space:]]*[\"\x27]?${SCRIPT}[\"\x27]?[[:space:]]*$"; then
              echo "Legacy mob runtime hook still present: $SCRIPT" >&2
              exit 1
            fi
          done

          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Soul Banner"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Kills with this banner capture &f1 soul&7.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Burst damage: &f8 × stored souls&7; costs &f1/3 of stored souls&7.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Power Banks"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Discharge cost: &f0-499,999 J &7per activation.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Energy cost: &f2 J &7per &f1 J &7transferred.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Successful capture total: &f300 J'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Releases a baby Magic mob when used on a block.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Creates the corresponding artificial mob when used on a block.'
          test "$(unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fc 'Native Java scheduler')" -eq 132

          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Right-click to fire a focused magic shot.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Right-click to fire a charged magic laser.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Right-click to store &f100 experience levels.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Makes that item permanently unbreakable.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'A single-use PvP relic.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Flame Formation"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Consumes all hunger and saturation'
          unzip -p "$JAR" embedded/Magic/foods.yml | grep -Fq 'Grants &f1-3 random potion effects&7.'
          unzip -p "$JAR" embedded/Magic/foods.yml | grep -Fq 'name: "&dMagic Fireproof Tonic"'
          unzip -p "$JAR" embedded/Magic/foods.yml | grep -Fq 'name: "&dMagic Lucky Stew"'
          unzip -p "$JAR" embedded/Magic/foods.yml | grep -Fq 'Effect level: &f1-50'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Zombie Data Card"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Created by the Magic Data Card Inserter.'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'name: "&dMagic Data Card Inserter"'
          unzip -p "$JAR" embedded/Magic/recipe_machines.yml | grep -Fq 'Energy per craft: 20,000 J'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'Used for Magic storage upgrade recipes.'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'Right-click to release the stored experience.'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'Used for Magic grinding recipes.'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'Energy per craft: 100 J'
          unzip -p "$JAR" embedded/Magic/workbenches.yml | grep -Fq 'Capacity: 1,000 J'
          unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fq 'Runtime draw: 1,314 J per machine tick'
          unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fq 'Requires a &fMagic Geominer Box &7below.'
          unzip -p "$JAR" embedded/Magic/recipe_types.yml | grep -Fq 'Extracts local Magic GEO resources.'
          unzip -p "$JAR" embedded/Magic/scripts/magic_custom_machine.js | grep -Fq 'Magic Geominer: '
          unzip -p "$JAR" embedded/Magic/scripts/magic_custom_machine.js | grep -Fq 'No supported Magic GEO resources remain here.'
          unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fq 'name: "&dMagic Infinity Processor"'
          unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fq 'Capacity: 2,147,483,647 J'
          unzip -p "$JAR" embedded/Magic/machines.yml | grep -Fq 'Runtime draw scales with installed modules'
          unzip -p "$JAR" embedded/Magic/scripts/魔法无尽一体化.js | grep -Fq 'Insufficient Power'
          unzip -p "$JAR" embedded/Magic/scripts/魔法无尽一体化.js | grep -Fq 'Magic Infinity Processing'
          unzip -p "$JAR" embedded/Magic/scripts/魔法无尽一体化.js | grep -Fq 'Output Data'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Blizzard Core"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Compressed Reactor Coolant Cell"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Chicken Relic"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'High-tier Magic crafting material.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Reinforced bucket forged from Infinity Ingots.'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'material: IE_EXTREME_FREEZER'
          unzip -p "$JAR" embedded/Magic/items.yml | sed -n '/material: IE_EXTREME_FREEZER/,+1p' | grep -Fq 'amount: 1'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'name: "&dMagic Battery LI-I (Empty)"'
          unzip -p "$JAR" embedded/Magic/items.yml | grep -Fq 'Stored energy: &f2,000 / 2,000 J'
          unzip -p "$JAR" embedded/Magic/recipe_machines.yml | grep -Fq 'name: "&dMagic Battery Charger I"'
          unzip -p "$JAR" embedded/Magic/recipe_machines.yml | grep -Fq 'Energy per charge: 1,000 J'
          unzip -p "$JAR" embedded/Magic/saveditems/QYZJ_1.yml | grep -Fq 'Restores 1% of damage dealt as health'

          javap -verbose -classpath "$JAR" io.github.wickidcow.magiclegacy.MagicLegacyPlugin \
            | grep -Fq 'major version: 65'
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq "version: Legacy-${{ steps.version.outputs.version }}"
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq -- "- \" Legacy version: ${{ steps.version.outputs.version }}\""
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq -- '- DynaTech'
          sha256sum "$JAR"

      - uses: actions/upload-artifact@v7
        with:
          name: SF_MagicLegacy${{ steps.version.outputs.version }}
          path: build/libs/SF_MagicLegacy${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

name: Build Magic Legacy Plugin

on:
  push:
    branches:
      - main
      - standalone-plugin-2.0
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'saveditems/**'
      - '*.yml'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'saveditems/**'
      - '*.yml'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Java 21 drop-in JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and verify managed Magic runtime JAR
        run: |
          set -euo pipefail
          gradle clean shadowJar verifyMagicJar \
            -PplatformVersion=1.21.11-R0.1-SNAPSHOT \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon

      - name: Inspect distributable
        run: |
          set -euo pipefail
          JAR=build/libs/SF_MagicLegacy2.0.4.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'embedded/Magic/info.yml'
          jar tf "$JAR" | grep -Fxq 'embedded/Magic/items.yml'
          jar tf "$JAR" | grep -Fxq 'embedded/Magic/scripts/服务器.js'
          jar tf "$JAR" | grep -Fxq 'io/github/wickidcow/magiclegacy/MagicGunListener.class'
          jar tf "$JAR" | grep -Fxq 'io/github/wickidcow/magiclegacy/ChristmasSnowballListener.class'
          jar tf "$JAR" | grep -Fxq 'io/github/wickidcow/magiclegacy/ExperienceItemListener.class'
          jar tf "$JAR" | grep -Fxq 'io/github/wickidcow/magiclegacy/UnbreakableRuneListener.class'
          jar tf "$JAR" | grep -Fxq 'io/github/wickidcow/magiclegacy/MagicWeaponListener.class'
          for SCRIPT in             'embedded/Magic/scripts/基础枪.js'             'embedded/Magic/scripts/CHRISTMAS_SNOWBALL.js'             'embedded/Magic/scripts/MFEXPBOTTLE.js'             'embedded/Magic/scripts/MFEXPBOTTLE100.js'             'embedded/Magic/scripts/UNBREAKABLE_RUNE.js'             'embedded/Magic/scripts/INFINITE_STICK.js'             'embedded/Magic/scripts/QYZJ_1.js'; do
            if jar tf "$JAR" | grep -Fxq "$SCRIPT"; then
              echo "Migrated runtime script still packaged: $SCRIPT" >&2
              exit 1
            fi
          done
          if unzip -p "$JAR" embedded/Magic/items.yml | sed -n '/^MAGIC_GUN_1:/,/^[A-Z0-9_][A-Z0-9_]*:/p' | grep -Fq 'script: 基础枪'; then
            echo "MAGIC_GUN_1 still has the legacy JavaScript hook in the embedded runtime" >&2
            exit 1
          fi
          if unzip -p "$JAR" embedded/Magic/items.yml | sed -n '/^MAGIC_CHRISTMAS_SNOWBALL:/,/^[A-Z0-9_][A-Z0-9_]*:/p' | grep -Fq 'script: CHRISTMAS_SNOWBALL'; then
            echo "MAGIC_CHRISTMAS_SNOWBALL still has the legacy JavaScript hook in the embedded runtime" >&2
            exit 1
          fi
          for SPEC in             'MAGIC_EXP_COLLECTOR|MFEXPBOTTLE'             'MAGIC_EXP_BOTTLE|MFEXPBOTTLE100'             'MAGIC_UNBREAKABLE_RUNE|UNBREAKABLE_RUNE'             'MAGIC_INFINITE_STICK|INFINITE_STICK'             'MAGIC_INFINITY_BLADE_1|QYZJ_1'; do
            ITEM="${SPEC%%|*}"
            SCRIPT="${SPEC#*|}"
            if unzip -p "$JAR" embedded/Magic/items.yml | sed -n "/^${ITEM}:/,/^[A-Z0-9_][A-Z0-9_]*:/p" | grep -Fq "script: ${SCRIPT}"; then
              echo "${ITEM} still has the legacy JavaScript hook in the embedded runtime" >&2
              exit 1
            fi
          done
          javap -verbose -classpath "$JAR" io.github.wickidcow.magiclegacy.MagicLegacyPlugin \
            | grep -Fq 'major version: 65'
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq 'version: Legacy-2.0.4'
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq -- '- " Legacy version: 2.0.4"'
          unzip -p "$JAR" embedded/Magic/info.yml | grep -Fxq -- '- DynaTech'
          sha256sum "$JAR"

      - uses: actions/upload-artifact@v7
        with:
          name: SF_MagicLegacy2.0.4
          path: build/libs/SF_MagicLegacy2.0.4.jar
          if-no-files-found: error

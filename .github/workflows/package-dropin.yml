name: Package Magic Drop-In

on:
  push:
    branches:
      - magic-legacy-runtime-fix
    paths:
      - .github/workflows/package-dropin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime Magic folder
        shell: bash
        run: |
          set -euo pipefail
          root="dist/Magic"
          mkdir -p "$root/saveditems" "$root/scripts"
          cp ./*.yml "$root/"
          if [ -d saveditems ]; then
            cp -R saveditems/. "$root/saveditems/"
          fi
          if [ -d scripts ]; then
            find scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
              target="$root/$file"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            done
          fi
          (cd dist && zip -9 -r ../Magic-Drop-In.zip Magic >/dev/null)

      - name: Verify package has runtime files only
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 Magic-Drop-In.zip | grep '^Magic/info.yml$'
          unzip -Z1 Magic-Drop-In.zip | grep '^Magic/items.yml$'
          if unzip -Z1 Magic-Drop-In.zip | grep -Eq '(^|/)\.github/|\.py$|(^|/)audit/|(^|/)tools/'; then
            echo "Maintenance files leaked into package"
            exit 1
          fi

      - name: Upload drop-in zip
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Drop-In
          path: Magic-Drop-In.zip
          if-no-files-found: error

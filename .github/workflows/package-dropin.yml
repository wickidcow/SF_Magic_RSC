name: Package Magic Drop-In

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '*.yml'
      - 'saveditems/**'
      - 'scripts/**/*.js'
      - 'tools/**'
      - '.github/workflows/package-dropin.yml'
  push:
    branches:
      - main
    paths:
      - '*.yml'
      - 'saveditems/**'
      - 'scripts/**/*.js'
      - 'tools/**'
      - '.github/workflows/package-dropin.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('info.yml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*["\x27]?([^"\x27\r\n]+)', text, re.M)
          if not match:
              raise SystemExit('Could not read version from info.yml')
          print(match.group(1).strip())
          PY
          )"
          safe_version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')"
          archive="Magic-${safe_version}-Drop-In.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build runtime Magic folder
        shell: bash
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          set -euo pipefail
          root="dist/Magic"
          mkdir -p "$root/saveditems" "$root/scripts"

          cp ./*.yml "$root/"

          if [ -d saveditems ]; then
            cp -R saveditems/. "$root/saveditems/"
          fi

          if [ -d scripts ]; then
            find scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
              target="$root/$file"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            done
          fi

          python tools/apply_runtime_fixes.py "$root"
          python tools/clean_magic_text_quality.py "$root"

          cat > dist/directions.txt <<'EOF'
          Magic RSC Legacy - Installation Directions
          ==========================================

          Requirement:
          - RykenSlimefunCustomizer (RSC) must be installed on the server.

          Installation:
          1. Stop the Minecraft server.
          2. Open the plugins/RykenSlimefunCustomizer/addons/ folder.
          3. Drop the included Magic folder directly into the addons folder.
          4. The final path should be:
             plugins/RykenSlimefunCustomizer/addons/Magic/info.yml
          5. If an older Magic folder already exists, replace it with this one instead of merging old files into it.
          6. Start the server.

          This ZIP contains the ready-to-use Magic addon folder for RSC.
          EOF

          (cd dist && zip -9 -r "../$ARCHIVE" Magic directions.txt >/dev/null)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Verify drop-in package
        shell: bash
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          set -euo pipefail

          test "$(unzip -Z1 "$ARCHIVE" | grep -c '^Magic/info.yml$')" -eq 1
          test "$(unzip -Z1 "$ARCHIVE" | grep -c '^Magic/items.yml$')" -eq 1
          test "$(unzip -Z1 "$ARCHIVE" | grep -c '^directions.txt$')" -eq 1
          unzip -p "$ARCHIVE" directions.txt | grep -q 'RykenSlimefunCustomizer (RSC)'
          unzip -p "$ARCHIVE" directions.txt | grep -q 'plugins/RykenSlimefunCustomizer/addons/'

          if unzip -Z1 "$ARCHIVE" | grep -Eq '(^|/)\.github/|\.py$|(^|/)audit/|(^|/)tools/|(^|/)README\.md$'; then
            echo "Drop-in archive contains repository maintenance files"
            exit 1
          fi

          if unzip -p "$ARCHIVE" Magic/items.yml | grep -q '^MAGIC_POWERED_BEDROCK_COMPAT:'; then
            echo "Obsolete POWERED_BEDROCK compatibility shim remained in runtime package"
            exit 1
          fi

          if unzip -p "$ARCHIVE" Magic/template_machines.yml | grep -q 'io.github.mooy1.infinityexpansion.items.blocks.InfinityWorkbench'; then
            echo "Old InfinityExpansion v1 workbench class remained in runtime package"
            exit 1
          fi

          echo "Verified $ARCHIVE"
          echo "ZIP contains Magic/ and directions.txt"
          echo "Drop Magic into plugins/RykenSlimefunCustomizer/addons/"

      - name: Upload Magic drop-in
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Legacy-Drop-In
          path: |
            ${{ steps.meta.outputs.archive }}
            ${{ steps.meta.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 90

name: Audit Magic JavaScript Messages

on:
  push:
    branches:
      - legacy-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit JavaScript strings
        run: python tools/audit_js_messages.py

      - name: Upload JavaScript audit
        uses: actions/upload-artifact@v4
        with:
          name: magic-js-message-audit
          path: |
            audit/js-chinese-strings.json
            audit/JS_MESSAGES.md
          if-no-files-found: error

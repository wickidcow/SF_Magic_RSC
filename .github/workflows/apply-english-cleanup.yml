name: Apply Magic English cleanup

on:
  push:
    branches:
      - cleanup/no-guizhan-english
    paths:
      - tools/englishize_yaml.py
      - tools/englishize_script_messages.py
      - .github/workflows/apply-english-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/no-guizhan-english
          fetch-depth: 0

      - name: Englishize YAML and remove GuizhanLib requirement
        run: python3 tools/englishize_yaml.py

      - name: Englishize script player messages
        run: python3 tools/englishize_script_messages.py

      - name: Verify GuizhanLib is not required
        shell: bash
        run: |
          if grep -RInE '^[[:space:]]*-[[:space:]]*GuizhanLibPlugin[[:space:]]*$' -- *.yml; then
            echo 'GuizhanLibPlugin is still declared.' >&2
            exit 1
          fi

      - name: Validate YAML
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML
          python3 - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('.').glob('*.yml'):
              with path.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', path)
          PY

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.yml' scripts tools/yaml-cjk-report.txt tools/script-message-cjk-report.txt
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove GuizhanLib requirement and Englishize Magic UI'
          git push origin HEAD:cleanup/no-guizhan-english

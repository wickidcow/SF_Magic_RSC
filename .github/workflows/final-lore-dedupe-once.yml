name: Final Magic Lore Dedupe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/final-lore-dedupe-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Magic text and lore
        run: python tools/clean_magic_text_quality.py .

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.yml' 'saveditems/*.yml'
          if git diff --cached --quiet; then
            echo "Magic source lore is already clean"
            exit 0
          fi
          git commit -m "Remove remaining duplicate Magic lore"
          git push

name: Apply Magic Legacy Port

on:
  push:
    branches:
      - legacy-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magic
        uses: actions/checkout@v4
        with:
          path: magic
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout InfinityExpansion v1 reference
        uses: actions/checkout@v4
        with:
          repository: Riley31415/InfinityExpansion
          ref: master
          path: ie1

      - name: Checkout InfinityExpansion2 Legacy reference
        uses: actions/checkout@v4
        with:
          repository: wickidcow/SF_InfinityExpansion2
          ref: master
          path: ie2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply source-verified migration
        working-directory: magic
        run: python scripts/apply_legacy_port.py --ie1 ../ie1 --ie2 ../ie2

      - name: Re-audit migrated pack
        working-directory: magic
        run: python scripts/audit_magic.py

      - name: Commit migrated YAML
        working-directory: magic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.yml' 'saveditems/*.yml'
          if git diff --cached --quiet; then
            echo "No YAML changes to commit"
            exit 0
          fi
          git commit -m "Port Magic content to InfinityExpansion2"
          git push origin HEAD:legacy-port
